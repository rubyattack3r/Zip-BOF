name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # ratchet:cachix/install-nix-action@v31
      - name: Lint, host tests, sanitizers, and both BOF formats
        run: nix develop --command make verify
      - name: Release packaging
        run: nix develop --command make release VERSION=v0.0.0-ci

  ratchet:
    name: Pinned actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: sethvargo/ratchet@9ca118155b0f79464185703a50da367e111107cd # ratchet:exclude tag:v0.12.0
        with:
          files: .github/workflows/*.yml
