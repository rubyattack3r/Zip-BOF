name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload bundles
      id-token: write # sign build provenance
      attestations: write # store build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # ratchet:cachix/install-nix-action@v31
      - name: Build, verify, and package
        run: nix develop --command make release VERSION="$GITHUB_REF_NAME"
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${version}]" \
            'index($0, heading) == 1 { found = 1; next } /^## / && found { exit } found' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
      - name: Publish release
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.sha256 \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # ratchet:actions/attest-build-provenance@v4
        with:
          subject-path: release/*.zip
